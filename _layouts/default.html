<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav><a href="{{ '/' | relative_url }}">Gift guides</a><a class="shop" href="{{ site.shop_url }}" rel="noopener">Visit the shop</a></nav>
  </header>
  <main>{{ content }}</main>
  <footer>
    <p>{{ site.description }}</p>
    <p><a href="{{ site.shop_url }}" rel="noopener">The Outpost Factory on Etsy</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
</body>
</html>
